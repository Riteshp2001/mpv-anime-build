# Laptop overrides for HP Pavilion Gaming 15-ec2xxx
# Ryzen 5 5600H + Radeon iGPU, GTX 1650 4 GB, 8 GB RAM, 1366x768 60 Hz panel.
# Loaded after mpv.conf by scripts/custom-config-loader.lua, so these win and
# survive build updates. Keep this the only mpv-*.conf file in this folder.

# --- GPU ---
# Vulkan lists the Radeon iGPU first and mpv uses the first device by default,
# so the upscaling shaders would run on the iGPU. Pin the GTX 1650.
vulkan-device=NVIDIA GeForce GTX 1650
# Same for D3D11 (gpu-api=d3d11 from the menu, or the VSR profile).
d3d11-adapter=NVIDIA

# --- Smooth motion on a 60 Hz panel ---
# 24 fps video on 60 Hz judders (3:2 pulldown). Sync to the display and blend
# the in-between frames (smoothmotion): judder-free, no soap-opera effect.
# Toggle with g.
video-sync=display-resample
interpolation=yes
tscale=oversample
# mpv's default. The build's 0.01 stops 29.97/59.94 fps video locking to 60 Hz.
video-sync-max-video-change=1

# --- Streams ---
# 4K is wasted on a 768p panel, and neither GPU can decode AV1 in hardware.
ytdl-format=bestvideo[height<=?1080][fps<=?60][vcodec!^=av01]+bestaudio/bestvideo[height<=?1080][fps<=?60]+bestaudio/best

# 8 GB RAM: the build allows up to 2 GiB of stream cache (1 GiB ahead + 1 GiB back).
[cache]
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB

# --- Battery ---
# Power Saving (on battery or Ctrl+p) also stops frame blending.
[Low-End]
interpolation=no

# mpv-gotorrent settings (all other options use their defaults)
# The defaults p and ctrl+k are taken by the Anime Build's input.conf
# (p = rotate video, Ctrl+k = adaptive sharpen), so use free keys instead.
key_stats=Alt+t
key_keep=Alt+k
# Connecting/loading status is shown in the centre by scripts/gotorrent-status.lua.
# Errors are still shown.
show_osd=no
